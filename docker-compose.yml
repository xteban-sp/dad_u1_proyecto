services:
  service-registry:
    build:
      context: ./service-registry
    container_name: service-registry
    environment:
      SERVER_PORT: 8761
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  config-service:
    build:
      context: ./config-service
    container_name: config-service
    environment:
      SERVER_PORT: 8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
    depends_on:
      service-registry:
        condition: service_healthy
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      SERVER_PORT: 8080
    depends_on:
      service-registry:
        condition: service_healthy
      config-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  mysql:
    image: mysql:8.0
    container_name: mysql-ms-cliente
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ms_cliente_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p123456"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - backend-net

  postgres:
    image: postgres:16
    container_name: postgres-ms-ventas
    environment:
      POSTGRES_DB: ms_ventas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ms_ventas_db"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - backend-net

  oracle-xe:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-ms-producto
    environment:
      ORACLE_PASSWORD: oracle123
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 20
    networks:
      - backend-net

  ms-cliente:
    build:
      context: ./ms-cliente
    container_name: ms-cliente
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ms_cliente_db
      DB_USER: root
      DB_PASS: 123456
      SERVER_PORT: 8081
    depends_on:
      service-registry:
        condition: service_healthy
      config-service:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  ms-producto:
    build:
      context: ./ms-producto
    container_name: ms-producto
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      DB_HOST: oracle-xe
      DB_PORT: 1521
      DB_NAME: XEPDB1
      DB_USER: system
      DB_PASS: oracle123
      SERVER_PORT: 8082
    depends_on:
      service-registry:
        condition: service_healthy
      config-service:
        condition: service_healthy
      oracle-xe:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

  ms-ventas:
    build:
      context: ./ms-ventas
    container_name: ms-ventas
    environment:
      CONFIG_SERVER_URL: http://config-service:8888
      EUREKA_SERVER_URL: http://service-registry:8761/eureka
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ms_ventas_db
      DB_USER: postgres
      DB_PASS: postgres
      SERVER_PORT: 8083
    depends_on:
      service-registry:
        condition: service_healthy
      config-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

volumes:
  mysql-data:
  postgres-data:
  oracle-data:

networks:
  backend-net:
    driver: bridge
